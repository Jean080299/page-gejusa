<!DOCTYPE html>

                    "outline": "#737688",

                    "on-error-container": "#93000a",
                    "on-primary-fixed": "#001452",
                    "inverse-surface": "#213145",
                    "background": "#f8f9ff",
                    "on-primary-container": "#dfe3ff",
                    "surface-container-low": "#eff4ff",
                    "secondary-fixed-dim": "#c6c6c6",
                    "on-primary-fixed-variant": "#0038b6",
                    "surface-dim": "#cbdbf5",

                    "on-error": "#ffffff",

            "borderRadius": {

            "spacing": {

                    "md": "24px",
                    "xs": "4px",
                    "sm": "12px",
                    "lg": "40px",
                    "xl": "64px",
                    "gutter": "20px",
                    "base": "8px"
            },
            "fontFamily": {
                    "h3": ["Lexend"],
                    "h1": ["Lexend"],

            "fontSize": {

                    "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                    "button": ["16px", {"lineHeight": "1", "letterSpacing": "0", "fontWeight": "500"}],

                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}]

          },
        },
      }

<style>
        body { font-family: 'Lexend', sans-serif; background-color: #f8f9ff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .ambient-shadow { shadow: 0px 10px 30px rgba(0, 0, 0, 0.04); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-background flex justify-between items-center px-md h-xl w-full">
<div class="flex items-center gap-sm">
<button class="text-primary hover:bg-surface-container-low transition-colors rounded-full p-xs active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-h2 text-h2 font-semibold text-primary">Gejusa</h1>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="max-w-md mx-auto px-md pt-base pb-xl">
<div class="flex flex-col items-center">
<!-- Profile Uploader -->
<div class="relative mt-sm mb-lg">
<div class="w-32 h-32 rounded-full bg-surface-container flex items-center justify-center border-4 border-white shadow-[0px_10px_30px_rgba(0,0,0,0.04)] overflow-hidden">
<span class="material-symbols-outlined text-outline text-[64px]">person</span>
<!-- Hidden background image placeholder -->
<div class="absolute inset-0 opacity-0">
<img class="w-full h-full object-cover" data-alt="A minimalist high-key headshot placeholder for a user profile in a high-tech app setting. The background is a soft gradient of pristine white and light blue, matching the Momentum Micro-Habit System aesthetic. The overall mood is clean, professional, and encouraging for a productivity-focused audience." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCluZ-ykHFZfEYaP5GGN4zedQ2_j3Dy9SKM-uWdEZIAvTvqhhbrJFcf4Xq_jRT-ntPMmVU-auvdNB79sDzNgwkvYr-K3NoWIhwGS-_HIVC97zjm-J-zLSUNgU_NFpEdfhYJX1muS2EspDYQi2R8rki9vtxygUlE3--mvx8eK1op3glC40MbrG-PPN5zQaNMfi0lgQ2i7PPrHbSyrA-2BIbzmaQo2AP-RxIegGjbkjV1sGQRSBTfWcmPJVU7EvmaGs2gyDPJQRFW3Yk"/>
</div>
</div>
<button class="absolute bottom-1 right-1 bg-primary-container text-on-primary w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<div class="text-center mb-lg">
<h2 class="font-h1 text-h1 text-on-surface mb-xs">Únete a Gejusa</h2>
<p class="font-body-md text-on-surface-variant">Comienza tu viaje de micro-hábitos hoy.</p>
</div>
<!-- Registration Form -->
<form class="w-full space-y-sm">
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline px-xs" for="nombre">Nombre Completo</label>
<div class="bg-white rounded-lg p-sm shadow-[0px_10px_30px_rgba(0,0,0,0.04)] transition-shadow hover:shadow-md">
<input class="w-full border-0 border-b border-outline-variant focus:ring-0 focus:border-primary-container p-0 font-body-md text-on-surface bg-transparent placeholder:text-outline-variant" id="nombre" placeholder="Ej. Juan Pérez" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline px-xs" for="email">Correo electrónico</label>
<div class="bg-white rounded-lg p-sm shadow-[0px_10px_30px_rgba(0,0,0,0.04)] transition-shadow hover:shadow-md">
<input class="w-full border-0 border-b border-outline-variant focus:ring-0 focus:border-primary-container p-0 font-body-md text-on-surface bg-transparent placeholder:text-outline-variant" id="email" placeholder="nombre@ejemplo.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline px-xs" for="password">Contraseña</label>
<div class="bg-white rounded-lg p-sm shadow-[0px_10px_30px_rgba(0,0,0,0.04)] transition-shadow hover:shadow-md flex items-center">
<input class="w-full border-0 border-b border-outline-variant focus:ring-0 focus:border-primary-container p-0 font-body-md text-on-surface bg-transparent placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined text-outline ml-2">visibility</span>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline px-xs">Interés principal</label>
<div class="grid grid-cols-3 gap-xs">
<label class="relative">
<input class="peer sr-only" name="interes" type="radio" value="Salud"/>
<div class="bg-white border border-outline-variant rounded-lg p-sm text-center cursor-pointer transition-all peer-checked:bg-primary-container peer-checked:text-white peer-checked:border-primary-container shadow-[0px_10px_30px_rgba(0,0,0,0.04)] active:scale-95">
<span class="material-symbols-outlined block mb-xs">favorite</span>
<span class="font-label-caps text-[10px]">Salud</span>
</div>
</label>
<label class="relative">
<input class="peer sr-only" name="interes" type="radio" value="Productividad"/>
<div class="bg-white border border-outline-variant rounded-lg p-sm text-center cursor-pointer transition-all peer-checked:bg-primary-container peer-checked:text-white peer-checked:border-primary-container shadow-[0px_10px_30px_rgba(0,0,0,0.04)] active:scale-95">
<span class="material-symbols-outlined block mb-xs">bolt</span>
<span class="font-label-caps text-[10px]">Productividad</span>
</div>
</label>
<label class="relative">
<input class="peer sr-only" name="interes" type="radio" value="Mente"/>
<div class="bg-white border border-outline-variant rounded-lg p-sm text-center cursor-pointer transition-all peer-checked:bg-primary-container peer-checked:text-white peer-checked:border-primary-container shadow-[0px_10px_30px_rgba(0,0,0,0.04)] active:scale-95">
<span class="material-symbols-outlined block mb-xs">psychology</span>
<span class="font-label-caps text-[10px]">Mente</span>
</div>
</label>
</div>
</div>
<div class="pt-lg">
<button class="w-full bg-primary-container text-white py-md rounded-xl font-button text-button shadow-lg active:scale-95 transition-all hover:bg-primary" type="submit">
                        Crear cuenta
                    </button>
<p class="text-center font-body-md text-on-surface-variant mt-sm">
                        ¿Ya tienes una cuenta? <span class="text-primary font-semibold cursor-pointer hover:underline" onclick="window.location.href='{{DATA:SCREEN:SCREEN_22}}'">Inicia sesión</span>
</p>
</div>
</form>
</div>
<!-- Asymmetric Background Accent -->
<div class="fixed top-0 right-0 -z-10 w-64 h-64 bg-surface-container opacity-40 blur-3xl rounded-full translate-x-1/2 -translate-y-1/2"></div>
<div class="fixed bottom-0 left-0 -z-10 w-80 h-80 bg-surface-container-high opacity-30 blur-3xl rounded-full -translate-x-1/2 translate-y-1/2"></div>
</main>
<!-- Bottom Margin for Focus -->
<div class="h-xl"></div>
</body></html>
