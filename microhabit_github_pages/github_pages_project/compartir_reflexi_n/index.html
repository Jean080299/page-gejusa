<body class="bg-background text-on-surface">
<!-- TopAppBar -->

<div class="flex items-center gap-sm">
<button class="active:scale-95 transition-transform p-xs">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">close</span>
</button>
<h1 class="font-h2 text-h2 font-semibold text-primary dark:text-primary-fixed-dim">HabitFlow</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden">

<div class="grid grid-cols-1 md:grid-cols-12 gap-lg">
<!-- LEFT COLUMN: Preview Canvas -->
<div class="md:col-span-7 lg:col-span-8 flex flex-col gap-sm">
<h2 class="font-h2 text-h2 text-on-background">Crea tu impacto</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-base">Personaliza cómo quieres que el mundo vea tu reflexión de hoy.</p>
<!-- The Visual Card -->
<div class="aspect-square w-full rounded-xl overflow-hidden relative shadow-[0px_10px_30px_rgba(0,0,0,0.06)] bg-primary-container flex items-center justify-center p-lg">
<!-- Background Image for the Card Content -->
<img alt="Background" class="absolute inset-0 w-full h-full object-cover opacity-30 mix-blend-overlay" data-alt="A serene and minimalist landscape featuring a calm mountain range at dusk, with deep blue and soft black tones. The lighting is low-key and atmospheric, creating a sense of profound stillness and discipline. This background is designed for a motivational quote overlay, maintaining high visual clarity and a modern, high-achiever aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBeEqijvRIFhb_K5tckdY8Q7-MmjLYQA3MkJpKb-1iXIZNvo14d86w8iLu5R8HmDzhRjgQ58beeo8JudC2dZPMEKYrnHth95K-eyOtLwp0Mdscn5sw06uX2StxYQAfXeTWYm0RRVl9D8gdKOJZNdiO02PNwFN16UhFWc3qJiQuCq4TAZel8hfBv8EQ8AXiPP6Ywu1PG5IiJo-kok5Tkt-shbkeN873DjtaPJR1-qzpQrbdNnnOzwCKfHxhBLlhtzQqS5o4abN4vWyQ"/>
<div class="absolute inset-0 bg-gradient-to-br from-primary/40 to-on-background/80"></div>
<div class="relative z-10 text-center flex flex-col items-center max-w-md">
<span class="material-symbols-outlined text-on-primary mb-md" style="font-size: 48px;">format_quote</span>
<blockquote class="font-h1 text-h1 text-on-primary text-center mb-lg leading-tight">
                            La disciplina es el puente entre las metas y los logros
                        </blockquote>
<div class="h-1 w-16 bg-on-primary/40 rounded-full mb-sm"></div>
<p class="font-label-caps text-label-caps text-on-primary/80 uppercase tracking-widest">HabitFlow Reflexión</p>
</div>
</div>
</div>
<!-- RIGHT COLUMN: Controls -->
<div class="md:col-span-5 lg:col-span-4 flex flex-col gap-lg">
<!-- Background Options -->
<section class="bg-surface-container-lowest p-md rounded-lg shadow-[0px_10px_30px_rgba(0,0,0,0.04)]">
<h3 class="font-h3 text-h3 text-on-background mb-sm">Estilo de fondo</h3>
<div class="grid grid-cols-4 gap-sm">
<button class="aspect-square rounded-lg border-2 border-primary-container bg-primary-container active:scale-95 transition-transform"></button>
<button class="aspect-square rounded-lg bg-on-background active:scale-95 transition-transform"></button>
<button class="aspect-square rounded-lg bg-gradient-to-br from-primary to-on-background active:scale-95 transition-transform"></button>
<button class="aspect-square rounded-lg bg-gradient-to-tr from-surface-dim to-primary active:scale-95 transition-transform"></button>
</div>
</section>

<div class="flex gap-sm">
<button class="flex-1 py-sm px-base flex flex-col items-center gap-xs rounded-lg hover:bg-surface-container-low transition-colors group">

</div>
<span class="font-label-caps text-label-caps text-secondary">Instagram</span>
</button>
<button class="flex-1 py-sm px-base flex flex-col items-center gap-xs rounded-lg hover:bg-surface-container-low transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary transition-all">
<span class="material-symbols-outlined">chat</span>
</div>
<span class="font-label-caps text-label-caps text-secondary">WhatsApp</span>
</button>
<button class="flex-1 py-sm px-base flex flex-col items-center gap-xs rounded-lg hover:bg-surface-container-low transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary transition-all">
<span class="material-symbols-outlined">post_add</span>
</div>
<span class="font-label-caps text-label-caps text-secondary">Twitter</span>
</button>
</div>
</section>

<span class="material-symbols-outlined">share</span>
                    Compartir ahora
                </button>
</div>
</div>

<span class="font-label-caps text-label-caps">Today</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined">flag</span>
<span class="font-label-caps text-label-caps">Goals</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-90 duration-200">

</button>

<span class="font-label-caps text-label-caps">Mood</span>
</button>
